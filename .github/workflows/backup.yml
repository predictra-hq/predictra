name: Backup

# M8 — backup cifrato del database DEV su Backblaze B2 e test di ripristino (ADR 0040).
# - backup: lunedì e giovedì alle 02:30 UTC (dump → cifratura AES-256 → B2; nessun artifact, ADR 0068)
# - restore-test: il giorno 1 di ogni mese alle 03:30 UTC (ultimo backup da B2 → ripristino locale)
# Avvio manuale: Actions → Backup → Run workflow (branch dev).
# Schedule e pulsante esistono solo quando questo file è anche su main.
# Runbook: docs/operations/backup-restore.md

# PR e push solo su dev (ADR 0061): il passaggio dev → main non ripete gli stessi controlli.
on:
  pull_request:
    branches: [dev]
    paths:
      - "scripts/backup/**"
      - ".github/workflows/backup.yml"
  schedule:
    # Lunedì e giovedì (ADR 0061: minuti del piano gratuito); prova di ripristino il 1° del mese.
    - cron: "30 2 * * 1,4"
    - cron: "30 3 1 * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Azione"
        type: choice
        options: [backup, restore-test, check]
        default: backup
      upload:
        description: "backup: carica su B2 (se disattivato il dump non viene conservato: serve solo con la prova di ripristino)"
        type: boolean
        default: true
      verify:
        description: "backup: prova subito il ripristino del backup appena creato"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: backup-${{ github.event_name == 'pull_request' && github.ref || 'run' }}
  cancel-in-progress: false

env:
  # ADR 0055: con PROD in servizio si salva PROD (DEV ne è una copia).
  ENVIRONMENT: ${{ vars.DATA_TARGET == 'prod' && 'prod' || 'dev' }}
  ACTION: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.action
    || github.event.schedule == '30 3 1 * *' && 'restore-test'
    || 'backup' }}

jobs:
  syntax:
    name: Sintassi degli script
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: for f in scripts/backup/*.sh; do bash -n "$f"; done

  run:
    name: Backup (${{ github.event_name == 'workflow_dispatch' && inputs.action || 'programmato' }})
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: operazioni
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ vars.DATA_TARGET == 'prod' && secrets.PROD_SUPABASE_PROJECT_ID || (vars.DATA_TARGET != 'prod' && secrets.DEV_SUPABASE_PROJECT_ID || '') }}
      SUPABASE_DB_PASSWORD: ${{ vars.DATA_TARGET == 'prod' && secrets.PROD_SUPABASE_DB_PASSWORD || (vars.DATA_TARGET != 'prod' && secrets.DEV_SUPABASE_DB_PASSWORD || '') }}
      SUPABASE_SECRET_KEY: ${{ vars.DATA_TARGET == 'prod' && secrets.PROD_SUPABASE_SECRET_KEY || (vars.DATA_TARGET != 'prod' && secrets.DEV_SUPABASE_SECRET_KEY || '') }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      UPLOAD: ${{ github.event_name != 'workflow_dispatch' || inputs.upload }}
      VERIFY: ${{ github.event_name == 'workflow_dispatch' && inputs.verify }}
    steps:
      - name: Verifica segreti
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD SUPABASE_SECRET_KEY BACKUP_PASSPHRASE B2_KEY_ID B2_APPLICATION_KEY B2_ENDPOINT B2_BUCKET; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error title=Backup::Segreti mancanti:$missing (docs/operations/backup-restore.md)"
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 3.2.0

      - name: Verifica chiavi B2
        if: env.ACTION == 'check'
        run: |
          source scripts/backup/b2-env.sh
          echo "Regione B2: $B2_REGION"
          key="check/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}.txt"
          echo "PREDICTRA check ${GITHUB_RUN_ID}" > /tmp/check.txt
          s3 cp /tmp/check.txt "s3://${B2_BUCKET}/${key}" --only-show-errors
          s3 cp "s3://${B2_BUCKET}/${key}" /tmp/check-back.txt --only-show-errors
          cmp /tmp/check.txt /tmp/check-back.txt
          s3 rm "s3://${B2_BUCKET}/${key}" --only-show-errors
          echo "B2: scrittura, lettura e cancellazione riuscite"

      - name: Dump cifrato
        id: dump
        if: env.ACTION == 'backup'
        run: |
          file="$(bash scripts/backup/dump.sh "$RUNNER_TEMP/backup")"
          echo "file=$file" >> "$GITHUB_OUTPUT"

      # Nessuna copia come artifact: con il repository pubblico (ADR 0068) gli artifact si
      # scaricano con qualunque account GitHub, e il dump contiene anche lo schema auth.
      - name: Caricamento su B2 e rotazione
        if: env.ACTION == 'backup' && env.UPLOAD == 'true'
        run: bash scripts/backup/upload.sh "${{ steps.dump.outputs.file }}"

      - name: Prova di ripristino del backup appena creato
        if: env.ACTION == 'backup' && env.VERIFY == 'true'
        run: bash scripts/backup/restore-verify.sh "${{ steps.dump.outputs.file }}"

      - name: Test di ripristino dell'ultimo backup su B2
        if: env.ACTION == 'restore-test'
        run: |
          file="$(bash scripts/backup/download-latest.sh "$RUNNER_TEMP/restore")"
          bash scripts/backup/restore-verify.sh "$file"
