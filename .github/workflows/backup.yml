name: Backup

# M8 — backup cifrato del database DEV su Backblaze B2 e test di ripristino (ADR 0040).
# Avvio manuale: Actions → Backup → Run workflow (branch dev), azione:
#   check        verifica chiavi B2 (scrive, legge e cancella un file di prova) e la CLI
# Runbook: docs/operations/backup-restore.md

on:
  pull_request:
    paths:
      - "scripts/backup/**"
      - ".github/workflows/backup.yml"
  workflow_dispatch:
    inputs:
      action:
        description: "Azione"
        type: choice
        options: [check]
        default: check

permissions:
  contents: read

concurrency:
  group: backup-${{ github.event_name == 'pull_request' && github.ref || 'run' }}
  cancel-in-progress: false

jobs:
  syntax:
    name: Sintassi degli script
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - run: for f in scripts/backup/*.sh; do bash -n "$f"; done

  check:
    name: Verifica chiavi e strumenti
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'check'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      B2_KEY_ID: ${{ secrets.B2_KEY_ID }}
      B2_APPLICATION_KEY: ${{ secrets.B2_APPLICATION_KEY }}
      B2_ENDPOINT: ${{ secrets.B2_ENDPOINT }}
      B2_BUCKET: ${{ secrets.B2_BUCKET }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 3.0.0
      - name: B2 — scrittura, lettura, cancellazione
        run: |
          source scripts/backup/b2-env.sh
          echo "Regione B2: $B2_REGION"
          if [ "${#BACKUP_PASSPHRASE}" -lt 32 ]; then
            echo "::warning::BACKUP_PASSPHRASE più corta di 32 caratteri"
          fi
          key="check/$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}.txt"
          echo "PREDICTRA check ${GITHUB_RUN_ID}" > /tmp/check.txt
          s3 cp /tmp/check.txt "s3://${B2_BUCKET}/${key}" --only-show-errors
          s3 cp "s3://${B2_BUCKET}/${key}" /tmp/check-back.txt --only-show-errors
          cmp /tmp/check.txt /tmp/check-back.txt
          s3 rm "s3://${B2_BUCKET}/${key}" --only-show-errors
          echo "B2: scrittura, lettura e cancellazione riuscite"
          echo "Object Lock del bucket:"
          s3api get-object-lock-configuration --bucket "$B2_BUCKET" 2>&1 | head -5 || true
      - name: CLI — opzioni di db dump
        run: |
          aws --version
          gpg --version | head -1
          supabase --version
          supabase db dump --help
