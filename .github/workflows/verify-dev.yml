name: Verifica DEV

# Verifiche automatiche su Supabase DEV con account temporanei di prova.
# - bankroll-isolation (M6, ADR 0030): isolamento dei dati personali, Super Admin
#   senza accesso, limiti personali. Gli account vengono sempre cancellati alla fine.
# - accessibility (M8, B1): l'app di QUESTO branch, avviata nel runner e collegata a
#   Supabase DEV, controllata con axe (WCAG 2.1 AA) pagina per pagina da un Super Admin
#   temporaneo con 2FA. Si può avviare anche da un branch di lavoro, prima del merge.
# - accessibility-prod: le stesse verifiche sul sito PROD in servizio (nessuna build nel
#   runner), con un Super Admin temporaneo `verifica-a11y-…@example.com` cancellato alla
#   fine insieme ai suoi dati DEMO. Restano solo le righe di audit della verifica.
# Avvio manuale: Actions → Verifica DEV → Run workflow (branch dev).
# Nelle PR si controlla solo la sintassi dello script.

# PR e push solo su dev (ADR 0061): il passaggio dev → main non ripete gli stessi controlli.
on:
  pull_request:
    branches: [dev]
    paths:
      - "apps/web/scripts/verify-*.mjs"
      - ".github/workflows/verify-dev.yml"
  workflow_dispatch:
    inputs:
      check:
        description: "Verifica da eseguire"
        type: choice
        options: [bankroll-isolation, accessibility, accessibility-prod, slip-analysis]
        default: bankroll-isolation

permissions:
  contents: read

concurrency:
  group: verify-dev-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  syntax:
    name: Sintassi degli script
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
      - run: for f in apps/web/scripts/verify-*.mjs; do node --check "$f"; done

  verify:
    name: Verifica (${{ inputs.check }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SUPABASE_PROJECT_ID: ${{ inputs.check == 'accessibility-prod' && secrets.PROD_SUPABASE_PROJECT_ID || secrets.DEV_SUPABASE_PROJECT_ID }}
      SUPABASE_SECRET_KEY: ${{ inputs.check == 'accessibility-prod' && secrets.PROD_SUPABASE_SECRET_KEY || secrets.DEV_SUPABASE_SECRET_KEY }}
      PROD_APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL }}
      CHECK: ${{ inputs.check }}
    steps:
      - name: Verifica segreti
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Mancano i segreti SUPABASE_PROJECT_ID o SUPABASE_SECRET_KEY dell'ambiente scelto"
            exit 1
          fi
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter web...
      - name: Avvio dell'app del branch (solo accessibility)
        if: env.CHECK == 'accessibility'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          # La chiave publishable non è segreta, ma non è nei segreti del repository:
          # si legge dalla Management API di Supabase.
          key=$(curl -fsS -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN"             "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/api-keys"             | jq -r '[.[] | select(.type == "publishable")][0].api_key // empty')
          if [ -z "$key" ]; then echo "::error::Chiave publishable di DEV non trovata"; exit 1; fi
          export NEXT_PUBLIC_SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          export NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY="$key"
          export APP_BASE_URL="http://localhost:3000"
          pnpm turbo run build --filter=web
          nohup pnpm --filter web start > "$RUNNER_TEMP/web.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS -o /dev/null http://localhost:3000/login && exit 0
            sleep 2
          done
          echo "::error::L'app non risponde su localhost:3000"
          cat "$RUNNER_TEMP/web.log"
          exit 1

      - name: Browser (solo accessibility)
        if: startsWith(env.CHECK, 'accessibility')
        run: pnpm --filter web exec playwright install --with-deps chromium

      - name: Verifica
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          case "$CHECK" in
            bankroll-isolation) node apps/web/scripts/verify-bankroll-isolation.mjs ;;
            accessibility)
              mkdir -p "$RUNNER_TEMP/screenshots"
              APP_URL=http://localhost:3000 SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" PRINT_TEXT=1 PRINT_SHOTS=1                 node apps/web/scripts/verify-accessibility.mjs ;;
            # Analisi delle schedine sui dati di DEV (copia di PROD, ADR 0070): solo numeri
            # aggregati nel log, che è pubblico.
            slip-analysis)
              pnpm --filter web exec vitest run --config vitest.analysis.config.mts ;;
            accessibility-prod)
              if [ -z "$PROD_APP_BASE_URL" ]; then echo "::error::Manca PROD_APP_BASE_URL"; exit 1; fi
              mkdir -p "$RUNNER_TEMP/screenshots"
              APP_URL="$PROD_APP_BASE_URL" SCREENSHOT_DIR="$RUNNER_TEMP/screenshots" PRINT_TEXT=1 PRINT_SHOTS=1 \
                node apps/web/scripts/verify-accessibility.mjs ;;
          esac

      - name: Errori del server (solo se la verifica fallisce)
        if: failure() && env.CHECK == 'accessibility'
        run: grep -iE "error|warn|unhandled|timeout" "$RUNNER_TEMP/web.log" | tail -80 || true

      # Screenshot di dashboard e lista utenti (account temporaneo, dati DEV), per
      # controllare a occhio il risultato. Conservati 3 giorni.
      - uses: actions/upload-artifact@v6
        if: always() && startsWith(env.CHECK, 'accessibility')
        with:
          name: screenshots
          path: ${{ runner.temp }}/screenshots
          retention-days: 3
          if-no-files-found: ignore
