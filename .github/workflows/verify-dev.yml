name: Verifica DEV

# Verifiche automatiche su Supabase DEV con account temporanei di prova.
# - bankroll-isolation (M6, ADR 0030): isolamento dei dati personali, Super Admin
#   senza accesso, limiti personali. Gli account vengono sempre cancellati alla fine.
# Avvio manuale: Actions → Verifica DEV → Run workflow (branch dev).
# Nelle PR si controlla solo la sintassi dello script.

on:
  pull_request:
    paths:
      - "apps/web/scripts/verify-*.mjs"
      - ".github/workflows/verify-dev.yml"
  workflow_dispatch:
    inputs:
      check:
        description: "Verifica da eseguire"
        type: choice
        options: [bankroll-isolation]
        default: bankroll-isolation

permissions:
  contents: read

concurrency:
  group: verify-dev-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  syntax:
    name: Sintassi degli script
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - run: for f in apps/web/scripts/verify-*.mjs; do node --check "$f"; done

  verify:
    name: Verifica (${{ inputs.check }})
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.DEV_SUPABASE_PROJECT_ID }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
    steps:
      - name: Verifica segreti
        run: |
          if [ -z "$SUPABASE_PROJECT_ID" ] || [ -z "$SUPABASE_SECRET_KEY" ]; then
            echo "::error::Mancano DEV_SUPABASE_PROJECT_ID o DEV_SUPABASE_SECRET_KEY"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile --filter web...
      - name: Verifica
        env:
          CHECK: ${{ inputs.check }}
        run: |
          export NEXT_PUBLIC_SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          case "$CHECK" in
            bankroll-isolation) node apps/web/scripts/verify-bankroll-isolation.mjs ;;
          esac
