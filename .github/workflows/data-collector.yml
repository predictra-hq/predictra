name: Data collector

# Raccolta dati verso Supabase DEV (ADR 0010, ADR 0015).
# - Test e lint del servizio Python a ogni PR o push che lo tocca.
# - Dall'8/11/2026 le raccolte automatiche le fa l'agente (workflow "Agent (Python)",
#   M7 fase A5): football-data.org ogni 3 ore (job football-data.collect) e quote
#   The Odds API daily e prematch (job odds.collect). Qui resta l'avvio manuale.
# - api-football-probe: verifica del piano API-Football (stagioni accessibili), M2 fase A3.
# - api-football-backfill: storico 2022-2024 da API-Football (risultati), M2 fase A3.
# - api-football-rescore: lo stesso storico riscaricato, dopo una correzione (ADR 0034).
# - Avvio manuale con la scelta del lavoro.
#   L'avvio manuale funziona solo quando questo file è sul branch di default
#   (main) ed esegue il codice del branch scelto (usare `dev`).
# Runbook: docs/operations/data-collector.md

# PR e push solo su dev (ADR 0061): il passaggio dev → main non ripete gli stessi controlli.
on:
  pull_request:
    branches: [dev]
    paths:
      - "services/data-collector/**"
      - ".github/workflows/data-collector.yml"
  push:
    branches: [dev]
    paths:
      - "services/data-collector/**"
      - ".github/workflows/data-collector.yml"
  workflow_dispatch:
    inputs:
      job:
        description: "Lavoro"
        type: choice
        options:
          [
            football-data,
            odds-daily,
            odds-prematch,
            api-football-probe,
            api-football-backfill,
            api-football-rescore,
            api-football-details,
          ]
        default: football-data
      competitions:
        description: "Codici separati da virgola (vuoto = tutte le competizioni della v1)"
        type: string
        required: false
      dry_run:
        description: "Solo lettura: non scrive su Supabase"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: data-collector-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'ingest' || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/data-collector

jobs:
  test:
    name: Python — lint e test
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Dipendenze
        run: uv sync --locked
      - name: Formattazione
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  ingest:
    name: Raccolta (${{ vars.DATA_TARGET == 'prod' && (github.ref_name == 'main' && 'PROD' || 'nessuno') || 'DEV' }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      JOB: ${{ inputs.job }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      SUPABASE_PROJECT_ID: ${{ (vars.DATA_TARGET == 'prod' && github.ref_name == 'main') && secrets.PROD_SUPABASE_PROJECT_ID || (vars.DATA_TARGET != 'prod' && secrets.DEV_SUPABASE_PROJECT_ID || '') }}
      SUPABASE_SECRET_KEY: ${{ (vars.DATA_TARGET == 'prod' && github.ref_name == 'main') && secrets.PROD_SUPABASE_SECRET_KEY || (vars.DATA_TARGET != 'prod' && secrets.DEV_SUPABASE_SECRET_KEY || '') }}
      DATA_ENV: ${{ vars.DATA_TARGET == 'prod' && (github.ref_name == 'main' && 'PROD' || 'nessuno') || 'DEV' }}
    steps:
      - name: Verifica segreti
        id: secrets
        working-directory: .
        run: |
          # ADR 0055: con PROD in servizio solo `main` raccoglie dati (su PROD); DEV li
          # riceve copiati da PROD, così ogni chiamata alle fonti si fa una volta sola.
          if [ "$DATA_ENV" = "nessuno" ]; then
            echo "::notice title=Raccolta saltata::DEV riceve i dati da PROD (workflow Copia dati tra ambienti, ADR 0055)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$JOB" in
            football-data) needed="FOOTBALL_DATA_API_KEY" ;;
            odds-*) needed="ODDS_API_KEY" ;;
            api-football-*) needed="API_FOOTBALL_KEY" ;;
            *) echo "::error::Lavoro sconosciuto: $JOB"; exit 1 ;;
          esac
          missing=""
          for v in $needed SUPABASE_PROJECT_ID SUPABASE_SECRET_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Raccolta saltata ($JOB)::Segreti mancanti:$missing (vedi docs/operations/data-collector.md)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.secrets.outputs.skip != 'true'
        with:
          # Schedule: sempre il codice di dev. Avvio manuale: il branch scelto in "Run workflow".
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}

      - uses: astral-sh/setup-uv@v7
        if: steps.secrets.outputs.skip != 'true'

      - name: Dipendenze
        if: steps.secrets.outputs.skip != 'true'
        run: uv sync --locked --no-dev

      - name: Raccolta
        if: steps.secrets.outputs.skip != 'true'
        env:
          COMPETITIONS: ${{ inputs.competitions }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: |
          export SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          case "$JOB" in
            football-data) args=(run) ;;
            odds-daily) args=(odds --mode daily) ;;
            odds-prematch) args=(odds --mode prematch) ;;
            # Verifica del piano API-Football: non scrive nulla, al massimo 6 richieste.
            api-football-probe) uv run python -m predictra_collector api-football-probe; exit $? ;;
            # Storico 2022-2024 (M2 fase A3): riprende dalle stagioni mancanti, al massimo 32 richieste.
            api-football-backfill) args=(api-football-backfill) ;;
            # Riscarica tutto lo storico con la normalizzazione attuale (ADR 0034): 32 richieste.
            api-football-rescore) args=(api-football-backfill --refresh) ;;
            # Statistiche e formazioni (ADR 0012): riprende dal punto in cui si era fermato.
            api-football-details) args=(api-football-details) ;;
          esac
          args+=(--triggered-by "$TRIGGERED_BY")
          if [ -n "$COMPETITIONS" ]; then args+=(--competitions "$COMPETITIONS"); fi
          if [ -n "$DRY_RUN" ]; then args+=("$DRY_RUN"); fi
          uv run python -m predictra_collector "${args[@]}"
