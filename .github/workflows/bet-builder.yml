name: Bet Builder

# M5 corsia A — motore delle combinazioni (ADR 0025–0027).
# - Test e lint del servizio Python a ogni PR o push che lo tocca.
# - Dall'8/11/2026 le esecuzioni programmate le fa l'agente (workflow "Agent (Python)",
#   job bet-builder.run, M7 fase A5): alle 06:47 e alle 15:47 UTC, dopo le quote e le
#   previsioni. Qui resta l'avvio manuale, che funziona solo quando questo file è su
#   `main` ed esegue il codice del branch scelto.
# Runbook: docs/operations/bet-builder.md

# PR e push solo su dev (ADR 0061): il passaggio dev → main non ripete gli stessi controlli.
on:
  pull_request:
    branches: [dev]
    paths:
      - "services/bet-builder/**"
      - "packages/shared-types/src/bet-builder.ts"
      - ".github/workflows/bet-builder.yml"
  push:
    branches: [dev]
    paths:
      - "services/bet-builder/**"
      - "packages/shared-types/src/bet-builder.ts"
      - ".github/workflows/bet-builder.yml"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo lettura: calcola le proposte senza scrivere"
        type: boolean
        default: false
      horizon_days:
        description: "Giorni di partite considerati"
        type: string
        default: "10"

permissions:
  contents: read

concurrency:
  group: bet-builder-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'run' || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/bet-builder

jobs:
  test:
    name: Python — lint e test
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: astral-sh/setup-uv@v7
      - name: Dipendenze
        run: uv sync --locked
      - name: Formattazione
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  run:
    name: Proposte (${{ (vars.DATA_TARGET == 'prod' && github.ref_name == 'main') && 'PROD' || 'DEV' }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: operazioni
    env:
      SUPABASE_PROJECT_ID: ${{ (vars.DATA_TARGET == 'prod' && github.ref_name == 'main') && secrets.PROD_SUPABASE_PROJECT_ID || ((vars.DATA_TARGET != 'prod' || github.ref_name != 'main') && secrets.DEV_SUPABASE_PROJECT_ID || '') }}
      SUPABASE_SECRET_KEY: ${{ (vars.DATA_TARGET == 'prod' && github.ref_name == 'main') && secrets.PROD_SUPABASE_SECRET_KEY || ((vars.DATA_TARGET != 'prod' || github.ref_name != 'main') && secrets.DEV_SUPABASE_SECRET_KEY || '') }}
      DATA_ENV: ${{ (vars.DATA_TARGET == 'prod' && github.ref_name == 'main') && 'PROD' || 'DEV' }}
    steps:
      - name: Verifica segreti
        id: secrets
        working-directory: .
        run: |
          missing=""
          for v in SUPABASE_PROJECT_ID SUPABASE_SECRET_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Bet Builder saltato::Segreti mancanti:$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v6
        if: steps.secrets.outputs.skip != 'true'
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          # Storia completa: serve per trovare l'ultimo commit che ha toccato il servizio.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        if: steps.secrets.outputs.skip != 'true'

      - name: Dipendenze
        if: steps.secrets.outputs.skip != 'true'
        run: uv sync --locked --no-dev

      - name: Bet Builder
        if: steps.secrets.outputs.skip != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          HORIZON: ${{ inputs.horizon_days || '10' }}
          TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: |
          export SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          export CODE_COMMIT="$(git log -1 --format=%H -- .)"
          args=(run --triggered-by "$TRIGGERED_BY" --horizon-days "$HORIZON")
          if [ -n "$DRY_RUN" ]; then args+=("$DRY_RUN"); fi
          uv run python -m predictra_bet_builder "${args[@]}"
