name: Bet Builder

# M5 corsia A — motore delle combinazioni (ADR 0025–0027).
# - Test e lint del servizio Python a ogni PR o push che lo tocca.
# - Esecuzione programmata due volte al giorno verso Supabase DEV, dopo le
#   raccolte delle quote delle 07:23 e delle 16:37 UTC (Data collector), più
#   l'avvio manuale. Il motore delle previsioni gira prima (05:40 e 14:40 UTC).
#   Schedule e avvio manuale funzionano solo quando questo file è su `main`.
#   Lo schedule esegue il codice di `dev`; l'avvio manuale quello del branch scelto.
# Runbook: docs/operations/bet-builder.md

on:
  pull_request:
    paths:
      - "services/bet-builder/**"
      - "packages/shared-types/src/bet-builder.ts"
      - ".github/workflows/bet-builder.yml"
  push:
    branches: [dev, main]
    paths:
      - "services/bet-builder/**"
      - "packages/shared-types/src/bet-builder.ts"
      - ".github/workflows/bet-builder.yml"
  schedule:
    - cron: "53 7 * * *"
    - cron: "7 17 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Solo lettura: calcola le proposte senza scrivere"
        type: boolean
        default: false
      horizon_days:
        description: "Giorni di partite considerati"
        type: string
        default: "7"

permissions:
  contents: read

concurrency:
  group: bet-builder-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'run' || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/bet-builder

jobs:
  test:
    name: Python — lint e test
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dipendenze
        run: uv sync --locked
      - name: Formattazione
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  run:
    name: Proposte (DEV)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.DEV_SUPABASE_PROJECT_ID }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
    steps:
      - name: Verifica segreti
        id: secrets
        working-directory: .
        run: |
          missing=""
          for v in SUPABASE_PROJECT_ID SUPABASE_SECRET_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Bet Builder saltato::Segreti mancanti:$missing"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.skip != 'true'
        with:
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          # Storia completa: serve per trovare l'ultimo commit che ha toccato il servizio.
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.skip != 'true'

      - name: Dipendenze
        if: steps.secrets.outputs.skip != 'true'
        run: uv sync --locked --no-dev

      - name: Bet Builder
        if: steps.secrets.outputs.skip != 'true'
        env:
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
          HORIZON: ${{ inputs.horizon_days || '7' }}
          TRIGGERED_BY: ${{ github.event_name == 'schedule' && 'schedule' || 'manual' }}
        run: |
          export SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          export CODE_COMMIT="$(git log -1 --format=%H -- .)"
          args=(run --triggered-by "$TRIGGERED_BY" --horizon-days "$HORIZON")
          if [ -n "$DRY_RUN" ]; then args+=("$DRY_RUN"); fi
          uv run python -m predictra_bet_builder "${args[@]}"
