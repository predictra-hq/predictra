name: Deploy target

# Workflow riutilizzabile: deploy completo di UN ambiente (dev o prod).
#   1. migrazioni SQL su Supabase      (supabase db push)
#   2. impostazioni Auth versionate    (supabase config push, da supabase/config.toml)
#   3. build e deploy dell'app su Vercel (CLI, deploy di produzione del progetto Vercel dell'ambiente)
# Se i segreti dell'ambiente non sono configurati, il deploy viene saltato con un avviso.

on:
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      ref:
        type: string
        required: true
    secrets:
      SUPABASE_ACCESS_TOKEN: { required: false }
      SUPABASE_PROJECT_ID: { required: false }
      SUPABASE_DB_PASSWORD: { required: false }
      APP_BASE_URL: { required: false }
      VERCEL_TOKEN: { required: false }
      VERCEL_ORG_ID: { required: false }
      VERCEL_PROJECT_ID: { required: false }

permissions:
  contents: read

jobs:
  deploy:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Environment `dev` (solo branch dev) o `prod` (solo branch main), ADR 0075. Se l'Environment
    # ha un segreto con lo stesso nome, vale quello e non quello passato dal chiamante.
    environment: ${{ inputs.environment }}
    # Mai due deploy contemporanei sullo stesso ambiente; nessuno viene annullato a metà.
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    env:
      DEPLOY_ENV: ${{ inputs.environment }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      APP_BASE_URL: ${{ secrets.APP_BASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Verifica configurazione ambiente
        id: config
        run: |
          missing=""
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_PROJECT_ID SUPABASE_DB_PASSWORD APP_BASE_URL VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Deploy ${DEPLOY_ENV} saltato::Segreti mancanti:$missing (vedi docs/operations/setup.md)"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Verifica autore del commit (piano Vercel Hobby)
        # Solo con il repository privato: su un repository pubblico Vercel Hobby accetta i
        # commit di tutti i collaboratori (ADR 0068).
        if: steps.config.outputs.ready == 'true' && github.event.repository.private
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ inputs.ref }}
          # Login dell'account proprietario (piano Vercel Hobby). Non `github.repository_owner`:
          # dal 15/11/2026 il repository è dell'organizzazione predictra-hq.
          OWNER: gennpalm
        run: |
          # Sul piano Hobby Vercel pubblica solo i commit dell'account proprietario: niente
          # collaborazione su repository privati. Il merge su dev e main lo fa il proprietario
          # con "Create a merge commit" (ADR 0050). Si controlla prima delle migrazioni, cosi
          # database e app restano allineati.
          author=$(gh api "repos/${{ github.repository }}/commits/$REF" --jq '.author.login // ""')
          if [ "$author" != "$OWNER" ]; then
            echo "::error title=Deploy ${DEPLOY_ENV} bloccato::Il commit $REF ha come autore '${author:-sconosciuto}', non '$OWNER'. Sul piano Vercel Hobby si pubblicano solo commit del proprietario: il merge va fatto da $OWNER con 'Create a merge commit' (ADR 0050, docs/operations/collaborazione.md)."
            exit 1
          fi

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        if: steps.config.outputs.ready == 'true'
        with:
          ref: ${{ inputs.ref }}
          # Storia completa di main e dev: serve al numero di versione (ADR 0066).
          fetch-depth: 0

      - name: Versione del sito (automatica per ambiente)
        if: steps.config.outputs.ready == 'true'
        run: |
          # PROD: la cifra di mezzo sale a ogni merge su main. DEV: l'ultima cifra conta i
          # commit di dev non ancora in produzione (ADR 0066). Niente commit di versione.
          release=$(scripts/release/version.sh "$DEPLOY_ENV")
          echo "APP_RELEASE=$release" >> "$GITHUB_ENV"
          echo "Versione ${DEPLOY_ENV}: v$release" >> "$GITHUB_STEP_SUMMARY"

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        if: steps.config.outputs.ready == 'true'
        with:
          version: 3.0.0

      - name: Supabase — migrazioni
        if: steps.config.outputs.ready == 'true'
        run: supabase db push --remote="$SUPABASE_PROJECT_ID" --password "$SUPABASE_DB_PASSWORD" --yes

      - name: Supabase — impostazioni Auth (config.toml)
        if: steps.config.outputs.ready == 'true'
        env:
          PREDICTRA_SITE_URL: ${{ secrets.APP_BASE_URL }}
          PREDICTRA_REDIRECT_URL: ${{ secrets.APP_BASE_URL }}/**
        run: supabase config push --remote="$SUPABASE_PROJECT_ID" --yes

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        if: steps.config.outputs.ready == 'true'

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        if: steps.config.outputs.ready == 'true'
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Vercel — build
        if: steps.config.outputs.ready == 'true'
        run: |
          npm install --global vercel@65.2.0
          vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
          vercel build --prod --token="$VERCEL_TOKEN"

      - name: Vercel — deploy
        if: steps.config.outputs.ready == 'true'
        run: |
          # Se Vercel rifiuta il deploy (per esempio per l'autore del commit) la CLI resta in
          # attesa senza errore: dopo 10 minuti ci si ferma con un messaggio chiaro.
          set +e
          url=$(timeout 600 vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN")
          code=$?
          set -e
          if [ "$code" -eq 124 ]; then
            echo "::error title=Vercel — deploy::Nessuna risposta da Vercel in 10 minuti: controlla il deploy su vercel.com (deploy bloccato? vedi ADR 0050)."
            exit 1
          elif [ "$code" -ne 0 ]; then
            exit "$code"
          fi
          echo "Deploy ${DEPLOY_ENV}: $url"
          echo "### Deploy ${DEPLOY_ENV} completato" >> "$GITHUB_STEP_SUMMARY"
          echo "App: ${APP_BASE_URL}" >> "$GITHUB_STEP_SUMMARY"
