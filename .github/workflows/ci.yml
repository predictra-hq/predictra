name: CI

on:
  pull_request:
    branches: [dev, main]
    # Le modifiche solo alla documentazione non fanno girare la CI (né il deploy):
    # risparmia minuti del piano gratuito (2.000/mese sui repo privati).
    paths-ignore: ["docs/**", "**/*.md"]
  push:
    branches: [dev, main]
    paths-ignore: ["docs/**", "**/*.md"]

# Un solo run per PR o per branch: annulla quelli superati (risparmia minuti free tier).
# PR e push hanno gruppi separati: un run di PR non può annullare un push (che fa
# deploy). Il 9/11/2026 il run della PR #48, partito dopo il merge, aveva lo stesso
# gruppo del push su main e lo ha annullato.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # Le PR superate vengono annullate; i push (che fanno deploy) no.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    # Sul push verso main (merge della PR dev → main) i controlli sono già passati sulla
    # PR, sullo stesso codice unito: si va diretti al deploy (ADR 0061).
    if: github.event_name != 'push' || github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Scansione dei segreti nello stesso job (ADR 0061): un job a parte costava un
      # minuto in più a ogni esecuzione, per l'arrotondamento al minuto.
      - name: Scansione segreti (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --verbose

      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      # Cache di Turborepo: i pacchetti con input invariati non rifanno lint, typecheck e
      # test. Solo `.turbo/cache`: la cache di Next (`.next/cache`) pesava quasi 1 GB e la
      # build gira solo nelle PR. v5 gira su Node 24 (v4 usava Node 20, deprecato). La
      # chiave cambia a ogni commit; si riparte dalla più recente del branch, poi da dev.
      - name: Cache Turborepo
        uses: actions/cache@v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-${{ github.head_ref || github.ref_name }}-
            turbo-${{ runner.os }}-dev-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + migrazioni + RLS)
        run: pnpm test

      # Sui push verso dev e main la build la rifà già il deploy (vercel build): qui solo
      # sulle PR, per non pagarla due volte (ADR 0061).
      - name: Build
        if: github.event_name == 'pull_request'
        run: pnpm build
        env:
          # Valori fittizi solo per la build: nessuna chiamata reale avviene in build.
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
          APP_BASE_URL: http://localhost:3000

      - name: Dependency audit (produzione)
        run: pnpm audit --prod --audit-level=high

  # ---------------------------------------------------------------------------
  # Deploy automatico: solo su push (non sulle PR) e solo se i controlli sono verdi.
  # dev  → progetto Supabase DEV  + progetto Vercel DEV
  # main → progetto Supabase PROD + progetto Vercel PROD (saltato finché i segreti PROD_* non esistono)
  # ---------------------------------------------------------------------------
  deploy-dev:
    name: Deploy DEV
    needs: [checks]
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    uses: ./.github/workflows/deploy-target.yml
    with:
      environment: dev
      ref: ${{ github.sha }}
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.DEV_SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.DEV_SUPABASE_DB_PASSWORD }}
      APP_BASE_URL: ${{ secrets.DEV_APP_BASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.DEV_VERCEL_PROJECT_ID }}

  deploy-prod:
    name: Deploy PROD
    needs: [checks]
    if: always() && needs.checks.result == 'skipped' && github.event_name == 'push' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/deploy-target.yml
    with:
      environment: prod
      ref: ${{ github.sha }}
    secrets:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.PROD_SUPABASE_PROJECT_ID }}
      SUPABASE_DB_PASSWORD: ${{ secrets.PROD_SUPABASE_DB_PASSWORD }}
      APP_BASE_URL: ${{ secrets.PROD_APP_BASE_URL }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.PROD_VERCEL_PROJECT_ID }}
