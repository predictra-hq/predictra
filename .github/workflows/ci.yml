name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# Un solo run per branch/PR: annulla quelli superati (risparmia minuti free tier).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test (unit + migrazioni + RLS)
        run: pnpm test

      - name: Build
        run: pnpm build
        env:
          # Valori fittizi solo per la build: nessuna chiamata reale avviene in build.
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: build-placeholder
          APP_BASE_URL: http://localhost:3000

      - name: Dependency audit (produzione)
        run: pnpm audit --prod --audit-level=high

  secrets:
    name: Scansione segreti
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Immagine ufficiale gitleaks (nessuna licenza richiesta, a differenza della action per le org).
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 git /repo --redact --verbose
