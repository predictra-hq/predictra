name: Agent (Python)

# Worker Python dell'agente autonomo (M7 corsia A, ADR 0003 e 0035).
# - Test e lint del servizio a ogni PR o push che lo tocca.
# - Schedule ogni 3 ore al minuto 47 (ADR 0035 §1, fase A5): il ciclo accoda i job della
#   finestra corrente e poi preleva quelli pronti:
#   - raccolta football-data.org, una per finestra di 3 ore;
#   - quote The Odds API: `daily` una volta al giorno dalle 06 UTC (ciclo delle 06:47) e
#     `prematch` dalle 15 UTC (ciclo delle 15:47), mai due volte nello stesso giorno.
#   - previsioni del motore M4: `morning` dalle 03 UTC (ciclo delle 03:47) e `afternoon`
#     dalle 12 UTC (ciclo delle 12:47), dopo la raccolta dello stesso ciclo.
#   Sostituisce gli schedule di "Data collector" e "Prediction engine".
# - Avvio manuale di un ciclo su DEV, con l'opzione di accodare un job di verifica.
# Schedule e avvio manuale funzionano solo quando questo file è sul branch di default
# (main). Lo schedule esegue il codice di `dev`; l'avvio manuale quello del branch scelto.
# Runbook: docs/operations/agent.md

on:
  pull_request:
    paths:
      - "services/agent/**"
      - "services/data-collector/**"
      - "services/prediction-engine/**"
      - ".github/workflows/agent-python.yml"
  push:
    branches: [dev, main]
    paths:
      - "services/agent/**"
      - "services/data-collector/**"
      - "services/prediction-engine/**"
      - ".github/workflows/agent-python.yml"
  schedule:
    - cron: "47 */3 * * *" # ciclo dell'agente: raccolta football-data.org e job in coda
  workflow_dispatch:
    inputs:
      selftest:
        description: "Prima del ciclo accoda un job agent.selftest.python (non legge né scrive dati)"
        type: choice
        options: [nessuno, riuscito, fallisce-una-volta, non-recuperabile]
        default: nessuno
      max_jobs:
        description: "Job massimi del ciclo"
        type: number
        default: 10
      plan_football_data:
        description: "Accoda la finestra corrente di raccolta football-data.org (come lo schedule)"
        type: boolean
        default: false
      plan_odds:
        description: "Accoda le quote della finestra corrente (daily 06-15 UTC, prematch 15-21 UTC; consuma crediti The Odds API)"
        type: boolean
        default: false
      plan_predictions:
        description: "Accoda le previsioni della finestra corrente (morning 03-12 UTC, afternoon 12-21 UTC)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-python-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'cycle' || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/agent

jobs:
  test:
    name: Python — lint e test
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Dipendenze
        run: uv sync --locked
      - name: Formattazione
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  cycle:
    name: Ciclo dell'agente (DEV)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SUPABASE_PROJECT_ID: ${{ secrets.DEV_SUPABASE_PROJECT_ID }}
      SUPABASE_SECRET_KEY: ${{ secrets.DEV_SUPABASE_SECRET_KEY }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - name: Verifica segreti
        id: secrets
        working-directory: .
        run: |
          missing=""
          for v in SUPABASE_PROJECT_ID SUPABASE_SECRET_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Ciclo saltato::Segreti mancanti:$missing (vedi docs/operations/agent.md)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.skip != 'true'
        with:
          # Schedule: sempre il codice di dev. Avvio manuale: il branch scelto in "Run workflow".
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          # Storia completa: CODE_COMMIT è l'ultimo commit che ha toccato il motore (ADR 0020).
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v6
        if: steps.secrets.outputs.skip != 'true'

      - name: Dipendenze
        if: steps.secrets.outputs.skip != 'true'
        run: uv sync --locked --no-dev

      - name: Job di verifica
        if: steps.secrets.outputs.skip != 'true' && github.event_name == 'workflow_dispatch' && inputs.selftest != 'nessuno'
        env:
          SELFTEST: ${{ inputs.selftest }}
        run: |
          export SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          case "$SELFTEST" in
            riuscito) payload='{}' ;;
            fallisce-una-volta) payload='{"fail_attempts": 1}' ;;
            non-recuperabile) payload='{"permanent": true}' ;;
          esac
          uv run python -m predictra_agent enqueue --type agent.selftest.python \
            --key "agent.selftest.python:${GITHUB_RUN_ID}" --payload "$payload"

      - name: Ciclo
        if: steps.secrets.outputs.skip != 'true'
        env:
          MAX_JOBS: ${{ github.event_name == 'schedule' && 10 || inputs.max_jobs }}
          PLAN_FOOTBALL_DATA: ${{ github.event_name == 'schedule' || inputs.plan_football_data }}
          PLAN_ODDS: ${{ github.event_name == 'schedule' || inputs.plan_odds }}
          PLAN_PREDICTIONS: ${{ github.event_name == 'schedule' || inputs.plan_predictions }}
        run: |
          export SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          # Versione dei modelli: dipende dal codice del motore, non da ogni commit (ADR 0020).
          CODE_COMMIT="$(git log -1 --format=%H -- ../prediction-engine)"
          export CODE_COMMIT
          args=(cycle --source github_actions --schedule agent-python --max-jobs "$MAX_JOBS")
          if [ "$PLAN_FOOTBALL_DATA" = "true" ]; then args+=(--plan football-data); fi
          if [ "$PLAN_ODDS" = "true" ]; then args+=(--plan odds); fi
          if [ "$PLAN_PREDICTIONS" = "true" ]; then args+=(--plan predictions); fi
          # Budget di minuti dell'agente: ADR 0035 §2.
          uv run python -m predictra_agent "${args[@]}" --minutes-quota 900
