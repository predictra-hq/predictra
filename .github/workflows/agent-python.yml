name: Agent (Python)

# Worker Python dell'agente autonomo (M7 corsia A, ADR 0003 e 0035).
# - Test e lint del servizio a ogni PR o push che lo tocca.
# - Schedule ogni 3 ore al minuto 47 (ADR 0035 §1, fase A5): il ciclo accoda i job della
#   finestra corrente e poi preleva quelli pronti:
#   - raccolta football-data.org, una per finestra di 3 ore;
#   - quote The Odds API: `daily` una volta al giorno dalle 06 UTC (ciclo delle 06:47) e
#     `prematch` dalle 15 UTC (ciclo delle 15:47), mai due volte nello stesso giorno.
#   - previsioni del motore M4: `morning` dalle 03 UTC (ciclo delle 03:47) e `afternoon`
#     dalle 12 UTC (ciclo delle 12:47), dopo la raccolta dello stesso ciclo.
#   - proposte del Bet Builder: `morning` dalle 06 UTC (ciclo delle 06:47) ed `evening`
#     dalle 15 UTC (ciclo delle 15:47), dopo le quote dello stesso ciclo.
#   Sostituisce gli schedule di "Data collector", "Prediction engine" e "Bet Builder".
# - Avvio manuale di un ciclo su DEV, con l'opzione di accodare un job di verifica.
# Schedule e avvio manuale funzionano solo quando questo file è sul branch di default
# (main). Lo schedule esegue il codice di `dev`; l'avvio manuale quello del branch scelto.
# Runbook: docs/operations/agent.md

# PR e push solo su dev (ADR 0061): il passaggio dev → main non ripete gli stessi controlli.
on:
  pull_request:
    branches: [dev]
    paths:
      - "services/agent/**"
      - "services/data-collector/**"
      - "services/prediction-engine/**"
      - "services/bet-builder/**"
      - ".github/workflows/agent-python.yml"
  push:
    branches: [dev]
    paths:
      - "services/agent/**"
      - "services/data-collector/**"
      - "services/prediction-engine/**"
      - "services/bet-builder/**"
      - ".github/workflows/agent-python.yml"
  # Nessuno schedule di GitHub dal 23/11/2026 (ADR 0061): il ciclo lo avvia QStash
  # (endpoint /api/jobs/cycle) tre volte al giorno, alle fasce di CYCLE_SLOTS_UTC in
  # apps/web/src/lib/agent/dispatch.ts. Lo schedule ogni 3 ore consumava troppi minuti.
  workflow_dispatch:
    inputs:
      selftest:
        description: "Prima del ciclo accoda un job agent.selftest.python (non legge né scrive dati)"
        type: choice
        options: [nessuno, riuscito, fallisce-una-volta, non-recuperabile]
        default: nessuno
      max_jobs:
        description: "Job massimi del ciclo"
        type: number
        default: 10
      plan_football_data:
        description: "Accoda la finestra corrente di raccolta football-data.org (come lo schedule) e il job giornaliero di statistiche e formazioni API-Football"
        type: boolean
        default: false
      plan_odds:
        description: "Accoda le quote della finestra corrente (daily 06-15 UTC, prematch 15-21 UTC; consuma crediti The Odds API)"
        type: boolean
        default: false
      plan_predictions:
        description: "Accoda le previsioni della finestra corrente (morning 03-12 UTC, afternoon 12-21 UTC)"
        type: boolean
        default: false
      plan_bet_builder:
        description: "Accoda le proposte del Bet Builder della finestra corrente (morning 06-15 UTC, evening 15-21 UTC)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agent-python-${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && 'cycle' || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: services/agent

jobs:
  test:
    name: Python — lint e test
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Dipendenze
        run: uv sync --locked
      - name: Formattazione
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Test
        run: uv run pytest

  cycle:
    name: Ciclo dell'agente (${{ vars.DATA_TARGET == 'prod' && (github.ref_name == 'main' && 'PROD' || 'nessuno') || 'DEV' }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: operazioni
    env:
      SUPABASE_PROJECT_ID: ${{ (vars.DATA_TARGET == 'prod' && github.ref_name == 'main') && secrets.PROD_SUPABASE_PROJECT_ID || (vars.DATA_TARGET != 'prod' && secrets.DEV_SUPABASE_PROJECT_ID || '') }}
      SUPABASE_SECRET_KEY: ${{ (vars.DATA_TARGET == 'prod' && github.ref_name == 'main') && secrets.PROD_SUPABASE_SECRET_KEY || (vars.DATA_TARGET != 'prod' && secrets.DEV_SUPABASE_SECRET_KEY || '') }}
      FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      DATA_ENV: ${{ vars.DATA_TARGET == 'prod' && (github.ref_name == 'main' && 'PROD' || 'nessuno') || 'DEV' }}
    steps:
      - name: Verifica segreti
        id: secrets
        working-directory: .
        run: |
          # ADR 0055: con PROD in servizio solo `main` raccoglie dati (su PROD); DEV li
          # riceve copiati da PROD, così ogni chiamata alle fonti si fa una volta sola.
          if [ "$DATA_ENV" = "nessuno" ]; then
            echo "::notice title=Raccolta saltata::DEV riceve i dati da PROD (workflow Copia dati tra ambienti, ADR 0055)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          missing=""
          for v in SUPABASE_PROJECT_ID SUPABASE_SECRET_KEY; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning title=Ciclo saltato::Segreti mancanti:$missing (vedi docs/operations/agent.md)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.secrets.outputs.skip != 'true'
        with:
          # Schedule: sempre il codice di dev. Avvio manuale: il branch scelto in "Run workflow".
          ref: ${{ github.event_name == 'schedule' && 'dev' || github.ref }}
          # Storia completa: le versioni dipendono dall'ultimo commit di ogni servizio (ADR 0020).
          fetch-depth: 0

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        if: steps.secrets.outputs.skip != 'true'

      - name: Dipendenze
        if: steps.secrets.outputs.skip != 'true'
        run: uv sync --locked --no-dev

      - name: Job di verifica
        if: steps.secrets.outputs.skip != 'true' && github.event_name == 'workflow_dispatch' && inputs.selftest != 'nessuno'
        env:
          SELFTEST: ${{ inputs.selftest }}
        run: |
          export SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          case "$SELFTEST" in
            riuscito) payload='{}' ;;
            fallisce-una-volta) payload='{"fail_attempts": 1}' ;;
            non-recuperabile) payload='{"permanent": true}' ;;
          esac
          uv run python -m predictra_agent enqueue --type agent.selftest.python \
            --key "agent.selftest.python:${GITHUB_RUN_ID}" --payload "$payload"

      - name: Ciclo
        if: steps.secrets.outputs.skip != 'true'
        env:
          MAX_JOBS: ${{ github.event_name == 'schedule' && 10 || inputs.max_jobs }}
          PLAN_FOOTBALL_DATA: ${{ github.event_name == 'schedule' || inputs.plan_football_data }}
          PLAN_ODDS: ${{ github.event_name == 'schedule' || inputs.plan_odds }}
          PLAN_PREDICTIONS: ${{ github.event_name == 'schedule' || inputs.plan_predictions }}
          PLAN_BET_BUILDER: ${{ github.event_name == 'schedule' || inputs.plan_bet_builder }}
        run: |
          export SUPABASE_URL="https://${SUPABASE_PROJECT_ID}.supabase.co"
          # Versioni: dipendono dal codice di ciascun servizio, non da ogni commit (ADR 0020).
          PREDICTION_ENGINE_COMMIT="$(git log -1 --format=%H -- ../prediction-engine)"
          BET_BUILDER_COMMIT="$(git log -1 --format=%H -- ../bet-builder)"
          export PREDICTION_ENGINE_COMMIT BET_BUILDER_COMMIT
          args=(cycle --source github_actions --schedule agent-python --max-jobs "$MAX_JOBS")
          if [ "$PLAN_FOOTBALL_DATA" = "true" ]; then args+=(--plan football-data); fi
          if [ "$PLAN_ODDS" = "true" ]; then args+=(--plan odds); fi
          if [ "$PLAN_PREDICTIONS" = "true" ]; then args+=(--plan predictions); fi
          if [ "$PLAN_BET_BUILDER" = "true" ]; then args+=(--plan bet-builder); fi
          # Budget di minuti dell'agente: ADR 0035 §2.
          uv run python -m predictra_agent "${args[@]}" --minutes-quota 900
