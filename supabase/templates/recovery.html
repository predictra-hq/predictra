<!-- Template "Reset Password" di Supabase Auth. Copiarlo in Dashboard → Authentication → Email Templates → Reset Password. -->
<h2>Reimposta la password</h2>
<p>Abbiamo ricevuto una richiesta di reimpostazione della password del tuo account PREDICTRA.</p>
<p>
  <a
    href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery&next=/reset-password"
  >
    Imposta una nuova password
  </a>
</p>
<p>Se non hai richiesto tu il reset, ignora questa email: la password attuale resta valida.</p>
