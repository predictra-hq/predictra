[project]
name = "predictra-agent"
version = "0.1.0"
description = "PREDICTRA — worker Python dell'agente autonomo (M7 corsia A): coda su Postgres via RPC"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1"]

[dependency-groups]
dev = ["pytest>=8.3,<9", "ruff>=0.11,<1"]

[project.scripts]
predictra-agent = "predictra_agent.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/predictra_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S", "SIM", "RUF"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S"]
